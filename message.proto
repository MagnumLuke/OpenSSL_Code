syntax = "proto3";
//准备要发送的数据, 客户端
message RequestMsg
{
	int32 cmdType = 1;		// 1.保温类型
	bytes clientID = 2;		// 2.客户端编号
	bytes serverID = 3;		// 3.服务器端编号
	bytes sign = 4;
	bytes data = 5;
}
//服务器端
message RespondMsg
{
	bool rv = 1;			//返回值
	int32 seckeyiD = 2;		//对称秘钥编号
	bytes clientID = 3;		//客户端编号
	bytes serverID = 4;		//服务器编号
	bytes data = 5;			//服务器端随机数
}
